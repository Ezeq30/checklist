<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Checklist Hipódromos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
  </div>

  <header class="topbar">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 12.5l4.5 4.5L20 6.5" />
      </svg>
      <div class="brand-text">
        <span class="brand-kicker">CHECKLIST</span>
        <span class="brand-title">Hipódromos</span>
      </div>
    </div>

    <nav class="tabs seg" id="tabs">
      <span class="seg-slider"></span>
      <button class="seg-btn tab" data-panel="hoy">
        <span class="tab-label">HOY</span>
        <span class="tab-hipo" id="tab-hipo-hoy"></span>
      </button>
      <button class="seg-btn tab" data-panel="manana">
        <span class="tab-label">MAÑANA</span>
        <span class="tab-hipo" id="tab-hipo-manana"></span>
      </button>
    </nav>

    <div class="topbar-right">
      <div class="xml-alert hidden" id="xml-alert">
        <span class="xml-dot"></span>
        <span class="xml-text" id="xml-text"></span>
        <button class="xml-listo" id="xml-listo">LISTO</button>
      </div>
      <button class="ghost-btn" id="btn-calendario" title="Ver calendario de hipódromos">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="5" width="17" height="15" rx="3" />
          <path d="M3.5 10h17M8 3v4M16 3v4" />
        </svg>
        <span>Calendario</span>
      </button>
      <button class="ghost-btn icon-only" id="btn-caballito" title="Caballito que sigue al mouse">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.5 4.5V11a5.5 5.5 0 0011 0V4.5" />
          <path d="M4.5 4.5h4M15.5 4.5h4" />
          <path d="M6.6 8.5h.01M6.9 12.5h.01M17.4 8.5h.01M17.1 12.5h.01" stroke-width="2.6" />
        </svg>
      </button>
      <button class="ghost-btn icon-only" id="btn-login" title="Iniciar sesión de administrador">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="10.5" width="14" height="9.5" rx="2.5" />
          <path d="M8.5 10.5V8a3.5 3.5 0 017 0v2.5" />
        </svg>
      </button>
    </div>
  </header>

  <main class="panel glass" id="panel">
    <div class="panel-head">
      <div class="hipo-title">
        <span class="hipo-dot"></span>
        <div class="hipo-text">
          <span class="hipo-name" id="hipo-name"></span>
          <span class="hipo-date" id="hipo-date"></span>
        </div>
      </div>

      <div class="seg mode-seg" id="mode-seg">
        <span class="seg-slider"></span>
        <button class="seg-btn" data-modo="dia1">D1</button>
        <button class="seg-btn" data-modo="dia2">
          <svg class="lock" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="10.5" width="14" height="9.5" rx="2.5" />
            <path d="M8.5 10.5V8a3.5 3.5 0 017 0v2.5" />
          </svg>
          D2
        </button>
      </div>

      <div class="progress" id="progress">
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <span class="progress-text" id="progress-text"></span>
      </div>

      <button class="primary-btn" id="btn-guardar">
        <span>GUARDAR</span>
      </button>
    </div>

    <div class="panel-body" id="panel-body"></div>
  </main>

  <div class="backdrop" id="backdrop"></div>

  <aside class="drawer glass" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <button class="round-btn" id="cal-prev" aria-label="Mes anterior">
        <svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6" /></svg>
      </button>
      <span class="cal-title" id="cal-title"></span>
      <button class="round-btn" id="cal-next" aria-label="Mes siguiente">
        <svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6" /></svg>
      </button>
      <button class="round-btn close" id="cal-close" aria-label="Cerrar">
        <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></svg>
      </button>
    </div>
    <div class="cal-week">
      <span>DOM</span><span>LUN</span><span>MAR</span><span>MIE</span><span>JUE</span><span>VIE</span><span>SAB</span>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-foot">
      <div class="cal-legend" id="cal-legend"></div>
      <span class="cal-hint" id="cal-hint"></span>
    </div>
    <div class="popover hidden" id="popover"></div>
  </aside>

  <div class="modal-layer hidden" id="modal-layer">
    <div class="modal glass" id="modal"></div>
  </div>

  <div class="toasts" id="toasts"></div>

  <div class="polvo" id="polvo" aria-hidden="true"></div>
  <div class="caballito" id="caballito" aria-hidden="true">
    <svg class="caballo" viewBox="0 0 100 60">
      <g class="caballo-cuerpo">
        <g class="pata tras lejana">
          <path class="muslo" d="M34 29 L30.5 42" />
          <g class="canilla"><path d="M30.5 42 L33 53.5 L35.5 54.6" /></g>
        </g>
        <g class="pata del lejana">
          <path class="muslo" d="M65 30 L66 42" />
          <g class="canilla"><path d="M66 42 L65.5 53.5 L68 54.6" /></g>
        </g>
        <path class="cola" d="M29 23.5 C22 21 15 22.5 8 27.5 C14 27.5 20.5 27.5 27.5 27.2 Z" />
        <path class="torso" d="M30 23.5 C36 20.2 52 21 61.5 21.8 C67.5 22.2 72 25 73 29 C73.5 32.6 70.5 35 66 35.2 C56 35.6 45 34.6 37 34.2 C31.5 33.9 27.5 32 26.5 29 C25.8 26.5 27.2 24.6 30 23.5 Z" />
        <g class="cabeza">
          <path d="M60.5 23 C65 18.5 71 14.6 77.6 11.8 L81 10.8 C84.6 11.2 89 14.4 92.4 17.8 C93.5 18.9 93.1 20.5 91.5 20.6 C88.4 20.8 85.6 19.8 83 19.6 C79.4 19.8 75.6 24 72.4 29.4 Z" />
          <path d="M78.8 11.6 L79.8 7.2 L82 11 Z" />
          <path class="crin" d="M62 21.5 C66.8 17.2 72 14 78.4 11.4" />
        </g>
        <g class="jinete">
          <path class="silks" d="M53.5 21 C55.5 16 60 12.4 65.5 11.2 L68 13.4 C64 15.4 60.6 18.4 59.4 21.8 Z" />
          <circle class="casco" cx="67.6" cy="8.6" r="2.7" />
          <path class="brazo" d="M65 12.6 L71 16.2 L75.5 19.4" />
          <path class="pierna" d="M56 20.6 L61.6 24.4 L58 27.6" />
        </g>
        <g class="pata tras cercana">
          <path class="muslo" d="M33 29.5 L29.5 42" />
          <g class="canilla"><path d="M29.5 42 L32 53.5 L34.5 54.6" /></g>
        </g>
        <g class="pata del cercana">
          <path class="muslo" d="M66.5 30.5 L67.5 42" />
          <g class="canilla"><path d="M67.5 42 L67 53.5 L69.5 54.6" /></g>
        </g>
      </g>
    </svg>
  </div>

  <script src="app.js"></script>
</body>
</html>
